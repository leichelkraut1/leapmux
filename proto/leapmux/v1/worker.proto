syntax = "proto3";
package leapmux.v1;

import "google/protobuf/timestamp.proto";
import "leapmux/v1/agent.proto";
import "leapmux/v1/channel.proto";
import "leapmux/v1/common.proto";
import "leapmux/v1/workspace.proto";

// WorkerConnectorService is called BY Worker instances on Hub via gRPC.
// Handles registration and the main bidirectional communication stream.
service WorkerConnectorService {
  // Register this worker using a registration key obtained out-of-band
  // from the hub UI. The key travels in the Authorization: Bearer header
  // and is consumed atomically; on success the hub returns a long-lived
  // auth token that the worker uses for subsequent Connect calls.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Main bidirectional stream for lifecycle notifications and E2EE channel management.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

// WorkerReconcilerService is called BY Workers on Hub via ConnectRPC.
// Authenticated by the worker's auth_token (the same bearer used for
// Connect). Provides the periodic worker-side orphan reconciler with the
// authoritative `workspace_tab_owned` view filtered to the calling worker.
service WorkerReconcilerService {
  rpc ListOwnedTabsForWorker(ListOwnedTabsForWorkerRequest) returns (ListOwnedTabsForWorkerResponse);
}

message ListOwnedTabsForWorkerRequest {}

message ListOwnedTabsForWorkerResponse {
  repeated WorkerTabState tab_states = 1;
  // The single owner this response is authoritative for -- the calling
  // worker's registrant. The hub's query binds it (workspace_tab_owned is
  // keyed by (user_id, tab_id), so worker_id alone selects across tenants),
  // which means `tabs` is a COMPLETE list for this owner and says NOTHING
  // about any other owner's tabs.
  //
  // The worker's orphan reconciler infers "absent from this list means
  // orphaned, reap it", so it must apply that inference only to local rows
  // owned by owner_user_id; a local row owned by anyone else is simply not
  // covered. Empty means the response declares no scope and is authoritative
  // for nobody -- the reconciler then reaps nothing (fail closed: an
  // undeclared scope must not read as a universal absence).
  string owner_user_id = 2;
}

// WorkerTabState identifies one tab that the Hub still owns and states whether
// the workspace that contains it is archived. It carries no workspace, tile,
// or position because the Worker stores none of that placement state.
message WorkerTabState {
  TabType tab_type = 1;
  string  tab_id   = 2;
  // Owner of the row in workspace_tab_owned, which is keyed by
  // (user_id, tab_id). FILE and IMAGE tab ids are unique only within a user, so
  // the worker's orphan reconciler needs the owner to match a hub row against
  // the right local worker_tab_payloads row -- without it, a row belonging to
  // another user misses the lookup and is reaped as an orphan. AGENT/TERMINAL
  // ids are globally unique, so their reconciliation ignores this field.
  string  user_id  = 3;
  WorkspaceArchiveState archive_state = 4;
}

// WorkerManagementService is called BY Frontend on Hub via ConnectRPC.
// Manages worker registration keys and listings. All RPCs require an
// authenticated user session.
service WorkerManagementService {
  // Mint a new registration key. The key expires in 5 minutes and is
  // automatically extended by the frontend dialog while it stays open.
  rpc CreateRegistrationKey(CreateRegistrationKeyRequest) returns (CreateRegistrationKeyResponse);
  // Push a registration key's expires_at out by another 5 minutes. The
  // hub refuses extensions when more than 2 minutes remain (anti-spam)
  // and refuses to resurrect already-expired keys.
  rpc ExtendRegistrationKey(ExtendRegistrationKeyRequest) returns (ExtendRegistrationKeyResponse);
  // Soft-delete a registration key (sets expires_at into the past). The
  // dialog calls this on close so the key cannot be used afterwards.
  rpc DeleteRegistrationKey(DeleteRegistrationKeyRequest) returns (DeleteRegistrationKeyResponse);
  // Email the registration command to the current user's verified email.
  rpc EmailRegistrationInstructions(EmailRegistrationInstructionsRequest) returns (EmailRegistrationInstructionsResponse);
  // List registered workers for the authenticated user.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  // Get a single worker's details.
  rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse);
  // Deregister a worker (graceful shutdown with notification).
  rpc DeregisterWorker(DeregisterWorkerRequest) returns (DeregisterWorkerResponse);
}

// --- Registration messages ---

message RegisterRequest {
  string version = 1;
  bytes public_key = 2;        // Worker's X25519 static public key for E2EE
  bytes mlkem_public_key = 3;  // Worker's ML-KEM-1024 public key for post-quantum key encapsulation
  bytes slhdsa_public_key = 4; // Worker's SLH-DSA-SHAKE-256f public key for post-quantum authentication
}

message RegisterResponse {
  string worker_id = 1;
  string auth_token = 2;
}

// WorkerStatus tracks the lifecycle state of a worker.
enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_ACTIVE = 1;
  WORKER_STATUS_DEREGISTERING = 2;
  WORKER_STATUS_DELETED = 3;
}

// NotificationType identifies what action a worker notification conveys.
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_DEREGISTER = 1;
}

// NotificationStatus tracks worker notification delivery state.
enum NotificationStatus {
  NOTIFICATION_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_STATUS_PENDING = 1;
  NOTIFICATION_STATUS_DELIVERED = 2;
  NOTIFICATION_STATUS_FAILED = 3;
}

message CreateRegistrationKeyRequest {}

message CreateRegistrationKeyResponse {
  string registration_key = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ExtendRegistrationKeyRequest {
  string registration_key = 1;
}

message ExtendRegistrationKeyResponse {
  google.protobuf.Timestamp expires_at = 1;
}

message DeleteRegistrationKeyRequest {
  string registration_key = 1;
}

message DeleteRegistrationKeyResponse {}

message EmailRegistrationInstructionsRequest {
  string registration_key = 1;
  // Pre-rendered command line built by the frontend. The backend embeds
  // this into the email body verbatim so the user can copy-paste straight
  // into a terminal on the worker host.
  string command = 2;
}

message EmailRegistrationInstructionsResponse {}

message ListWorkersRequest {
  PageRequest page = 1;
}

message ListWorkersResponse {
  repeated Worker workers = 1;
  PageResponse page = 2;
}

message GetWorkerRequest {
  string worker_id = 1;
}

message GetWorkerResponse {
  Worker worker = 1;
}

message DeregisterWorkerRequest {
  string worker_id = 1;
}

message DeregisterWorkerResponse {}

message Worker {
  string id = 1;
  bool online = 2;
  string created_at = 3;
  string last_seen_at = 4;
  string registered_by = 5;
  // True for the in-process worker auto-registered by the solo launcher
  // (Server.RegisterWorker). The deregister handler refuses these to
  // keep users from accidentally tearing down the bundled desktop
  // worker; the frontend hides the Deregister... menu item for the same
  // reason.
  bool auto_registered = 6;
}

// --- Bidirectional stream envelope messages ---

// ConnectRequest wraps all messages from Worker to Hub.
message ConnectRequest {
  string request_id = 1;
  oneof payload {
    // Lifecycle
    DeregisterAck deregister_ack = 10;
    WorkerTabInventory worker_tab_inventory = 11;
    // E2EE channels
    ChannelOpenResponse channel_open_resp = 12;
    ChannelMessage channel_message_resp = 13;
    // Health
    Heartbeat heartbeat = 14;
  }
}

// WorkerTabInventory is the whole-machine tab report a worker sends on connect,
// reconciled against the hub's CRDT-derived workspace_tab_owned view. The hub
// replies with WorkerTabInventoryResponse, whose only effect is to trigger a
// reconcile pass.
//
// Named for the worker, not a workspace: it was WorkspaceTabsSync, but it has
// never been per-workspace and now carries no workspace field at all -- the last
// "Workspace" name in a family this change otherwise renamed
// (WatchWorkerPrivateEvents, WorkerPrivateService, WorkerPrivateEvent,
// HubUnaryBridge, SnapshotForOwner).
//
// The hub TOMBSTONES every owned tab this report omits, so an omission is a
// deletion of the user's tabs. BuildTabSync is what must stay exhaustive.
message WorkerTabInventory {
  repeated TabRef tabs = 1;
}

// WorkerTabInventoryResponse acknowledges a tab-sync. It is deliberately EMPTY:
// its only effect on the worker is to trigger a reconcile pass.
//
// It once carried `orphan_tab_ids` and `reassignments`, a per-tab
// classification the hub computed on every sync. Nothing ever consumed them --
// the worker's OnTabSyncResponse handler discards the payload and calls
// Trigger() -- so they were a second, silently-diverging source of truth for a
// decision OrphanReconciler already makes from ListOwnedTabsForWorker. Worse,
// they would have been the WRONG source: the worker's report carries no user
// axis, so an orphan list derived from it could not be owner-scoped, while the
// reconciler's file-tab pass is.
//
// If a hub-driven classification is ever wanted again, it needs an owner axis
// on the request before the fields come back.
message WorkerTabInventoryResponse {}

// ConnectResponse wraps all messages from Hub to Worker.
message ConnectResponse {
  string request_id = 1;
  oneof payload {
    // Identity. Always the FIRST message on the stream (see WorkerIdentity).
    WorkerIdentity worker_identity = 10;
    // Lifecycle
    DeregisterNotification deregister = 11;
    HubShuttingDownNotification hub_shutting_down = 12;
    // E2EE channels
    ChannelOpenRequest channel_open = 13;
    ChannelMessage channel_message = 14;
    ChannelCloseNotification channel_close = 15;
    // Health
    Heartbeat heartbeat = 16;
    // Workspace-tabs sync result (carried in the same request_id as the
    // worker's WorkerTabInventory ConnectRequest payload).
    WorkerTabInventoryResponse worker_tab_inventory_resp = 17;
    // Convergence nudge (unsolicited, like heartbeat).
    ReconcileNudge reconcile_nudge = 18;
  }
}

// ReconcileNudge asks a worker to run its orphan reconciler now.
//
// Sent when a CRDT batch tombstones a tab the worker hosts. Closing a tab is a
// CRDT op, and the worker learns of it either through the close RPC or, when
// that never arrives, through the reconciler -- which otherwise runs on an
// hourly timer and is triggered only by the worker's own reconnect handshake. So
// a close whose RPC failed against a still-CONNECTED worker, or one a peer
// client or `leapmux control tab close` performed CRDT-only, left the agent
// subprocess running (and, for an active agent, burning tokens) for up to an
// hour, its worktree for up to two passes more.
//
// Carries no tab ids on purpose. The reconciler already re-reads the hub's
// authoritative owned-tab list on every pass, so a nudge only has to say "now";
// naming the tabs would add a second, staler source of truth for the same fact.
message ReconcileNudge {}

// WorkerIdentity tells a worker who owns it. The Hub sends it as the FIRST message
// on every Connect stream, before the connection is registered with the worker
// manager -- so nothing, in particular no ChannelOpen, can precede it.
//
// The Hub is the only authority: registered_by is sourced from
// workers.registered_by, which is NOT NULL and set at registration. The worker keeps
// no copy of its own, because a second source of truth is what let this value go
// missing: it used to be handed over once in RegisterResponse and cached in a local
// state file, so a file that predated the field, or was hand-edited or truncated,
// left the worker running with no owner -- and requireWorkerOwner gates every
// machine-scoped family (file, git, sysinfo, tunnel) on it, permanently denying the
// worker's own legitimate owner in a way that reads exactly like a genuine
// cross-tenant refusal.
//
// Re-delivered on every connect rather than once at registration, so a reconnect
// re-establishes it and the worker never has to persist it.
message WorkerIdentity {
  // User ID that registered this worker. Never empty.
  string registered_by = 1;
}

// --- Notification messages (used in bidi stream) ---

message DeregisterNotification {
  string reason = 1;
}

message DeregisterAck {}

// HubShuttingDownNotification is sent by the Hub to all connected workers
// when it is shutting down. Workers should wait retry_delay_seconds before
// attempting to reconnect, giving the Hub time to fully stop.
message HubShuttingDownNotification {
  int32 retry_delay_seconds = 1;
}

// --- Common ---

message Heartbeat {
  int64 timestamp_ms = 1;
  bytes public_key = 2;  // Worker's X25519 public key for E2EE channels (sent with first heartbeat)
  bytes mlkem_public_key = 3;  // Worker's ML-KEM-1024 public key for post-quantum key encapsulation
  bytes slhdsa_public_key = 4;  // Worker's SLH-DSA-SHAKE-256f public key for post-quantum authentication
  EncryptionMode encryption_mode = 5;  // Worker's encryption mode
}

// --- Inner RPC messages (E2EE channel, Frontend ↔ Worker) ---

message GetWorkerSystemInfoRequest {}

message GetWorkerSystemInfoResponse {
  string name = 1;     // Worker display name (from LEAPMUX_WORKER_NAME, defaults to hostname)
  string os = 2;
  string arch = 3;
  string home_dir = 4;
  string version = 5;
  string commit_hash = 6; // Optional short git commit ID injected at build time
  string build_time = 7;  // Optional build timestamp injected at build time
  string branch = 8;      // Optional git ref (branch or tag) injected at build time; empty for detached HEAD
  // What workflow placement can require of this computer: "os:<goos>",
  // "arch:<goarch>", detected tools ("git", "xcode"), and every entry of
  // LEAPMUX_WORKER_CAPABILITIES (comma-separated). Sorted, deduplicated.
  repeated string capabilities = 9;
}

// InspectNativeAgentProcesses observes same-OS-user processes outside this
// Worker's process tree. It never attaches to or resumes a native session.
message InspectNativeAgentProcessesRequest {}

// Explicit owner-only history read over the encrypted Worker channel. Paths,
// process IDs, launch arguments and provider configuration are never accepted.
message ReadNativeConversationRequest {
  AgentProvider agent_provider = 1;
  string session_id = 2;
  string cursor = 3;
  // latest (the initial page), before (older history), or after (live tail).
  string direction = 4;
  int32 limit = 5;
}

message NativeConversationRecord {
  string id = 1;
  int64 seq = 2;
  // Unmodified native record. A provider-owned frontend adapter projects it.
  bytes native_json = 3;
}

message ReadNativeConversationResponse {
  string format = 1;
  string session_id = 2;
  // Stable across appends; a replacement/truncation requires resetting pages.
  string revision = 3;
  string display_name = 4;
  string working_dir = 5;
  string older_cursor = 6;
  string newer_cursor = 7;
  string observed_at = 8;
  repeated NativeConversationRecord records = 9;
  bool has_older = 10;
  bool has_newer = 11;
  bool reset_required = 12;
  // Explicit bounded coverage warning, without OS error details or file data.
  string partial_reason = 13;
}

// External-chat control always addresses an existing live owner. None of these
// methods may cold-resume, launch another provider, or take over a saved chat.
message InspectNativeSessionControlRequest {
  AgentProvider agent_provider = 1;
  string session_id = 2;
}

message InspectNativeSessionControlResponse {
  string session_id = 1;
  string owner_label = 2;
  string transport_label = 3;
  bool can_send = 4;
  bool can_interrupt = 5;
  string unavailable_reason = 6;
  // Opaque short-lived binding to this Worker and the exact native owner.
  string binding_token = 7;
  string observed_at = 8;
  string expires_at = 9;
  string active_turn_id = 10;
  AgentActivityState activity_state = 11;
  repeated NativeSessionInputOutcome recent_inputs = 12;
  NativeSessionInputBehavior input_behavior = 13;
}

// The caller explicitly accepts the native owner's delivery semantics. Sending
// now may steer an active turn; it must never masquerade as a next-turn queue.
enum NativeSessionInputBehavior {
  NATIVE_SESSION_INPUT_BEHAVIOR_UNSPECIFIED = 0;
  NATIVE_SESSION_INPUT_BEHAVIOR_QUEUE_NEXT_TURN = 1;
  NATIVE_SESSION_INPUT_BEHAVIOR_SEND_NOW = 2;
}

// An enqueue receipt is not a claim that the provider started the prompt. The
// live owner reports later outcomes, including a Stop dropping queued input.
enum NativeSessionInputState {
  NATIVE_SESSION_INPUT_STATE_UNSPECIFIED = 0;
  NATIVE_SESSION_INPUT_STATE_QUEUED = 1;
  NATIVE_SESSION_INPUT_STATE_DISPATCHED = 2;
  NATIVE_SESSION_INPUT_STATE_STARTED = 3;
  NATIVE_SESSION_INPUT_STATE_DROPPED = 4;
  NATIVE_SESSION_INPUT_STATE_REJECTED = 5;
  NATIVE_SESSION_INPUT_STATE_UNCERTAIN = 6;
}

message NativeSessionInputOutcome {
  string request_id = 1;
  NativeSessionInputState state = 2;
  string detail = 3;
  string turn_id = 4;
}

enum NativeSessionInputDisposition {
  NATIVE_SESSION_INPUT_DISPOSITION_UNSPECIFIED = 0;
  NATIVE_SESSION_INPUT_DISPOSITION_ACCEPTED = 1;
  NATIVE_SESSION_INPUT_DISPOSITION_QUEUED = 2;
}

message SendNativeSessionInputRequest {
  AgentProvider agent_provider = 1;
  string session_id = 2;
  string binding_token = 3;
  string request_id = 4;
  string text = 5;
  NativeSessionInputBehavior input_behavior = 6;
}

message SendNativeSessionInputResponse {
  string session_id = 1;
  string request_id = 2;
  NativeSessionInputDisposition disposition = 3;
  string detail = 4;
}

message InterruptNativeSessionRequest {
  AgentProvider agent_provider = 1;
  string session_id = 2;
  string binding_token = 3;
  string request_id = 4;
  string expected_turn_id = 5;
}

message InterruptNativeSessionResponse {
  string session_id = 1;
  string request_id = 2;
  string detail = 3;
}

// Classification describes an executable, not whether a chat is working.
// UNKNOWN means a provider's name matched but CLI versus desktop is ambiguous.
enum NativeAgentProcessKind {
  NATIVE_AGENT_PROCESS_KIND_UNSPECIFIED = 0;
  NATIVE_AGENT_PROCESS_KIND_CLI = 1;
  NATIVE_AGENT_PROCESS_KIND_DESKTOP = 2;
  NATIVE_AGENT_PROCESS_KIND_UNKNOWN = 3;
}

message NativeAgentProcess {
  int32 pid = 1;
  int32 parent_pid = 2;
  // Basename only. No executable path, arguments, or environment.
  string executable_name = 3;
  AgentProvider agent_provider = 4;
  NativeAgentProcessKind kind = 5;
  // Live, read-only observations reported by the provider. Empty when unavailable.
  repeated NativeAgentSession sessions = 6;
}

message NativeAgentSession {
  // Opaque provider session identifier; no directory or conversation content.
  string session_id = 1;
  AgentActivityState activity_state = 2;
  // Optional provider- or agent-supplied display name, bounded and normalized as plain text.
  // Empty when no usable label was supplied. Never derived from conversation text.
  string display_name = 3;
  // Explicit agent claim, rather than a provider runtime observation.
  bool agent_reported = 4;
  // Original RFC3339 report time. Polling never refreshes these timestamps.
  string reported_at = 5;
  string report_expires_at = 6;
  // Runtime evidence time, separate from a verified continuous source heartbeat.
  string status_observed_at = 7;
  string source_verified_at = 8;
  string expires_at = 9;
}

// An OS-verified application service. Its PID is not an individual agent PID.
message NativeAgentServiceGroup {
  string source_id = 1;
  AgentProvider agent_provider = 2;
  int32 service_pid = 3;
  // Basename only; no path, owner SID, or runtime payload.
  string executable_name = 4;
  bool available = 5;
  // Coverage is bounded and may omit sessions with no known owner.
  bool partial = 6;
  int32 candidate_count = 7;
  bool candidate_truncated = 8;
  int32 subscription_limit = 9;
  repeated NativeAgentSession sessions = 10;
}

message InspectNativeAgentProcessesResponse {
  repeated NativeAgentProcess processes = 1;
  // RFC3339 time when the successful observation completed.
  string observed_at = 2;
  // Recognized same-user processes before the response cap, including omitted rows.
  int32 total_count = 3;
  repeated NativeAgentServiceGroup service_groups = 4;
}
